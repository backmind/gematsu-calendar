name: Update Gematsu Calendar

# Descarga el feed iCal de Gematsu una vez al día, lo guarda en el repo y lo
# publica en GitHub Pages, generando un endpoint suscribible y siempre
# actualizado para Google Calendar.
#
# El commit del .ics no es solo un histórico: GitHub desactiva los workflows
# programados tras 60 días sin commits en el repo. Esa actividad automática es
# lo que mantiene el cron vivo.

on:
  schedule:
    # Todos los días a las 06:00 UTC. Usa https://crontab.guru para ajustarlo.
    - cron: '0 6 * * *'
  # Permite ejecutarlo manualmente desde la pestaña Actions (botón "Run workflow").
  workflow_dispatch:

# Permisos mínimos necesarios: commitear el .ics y desplegar en GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Evita despliegues solapados, pero no cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar el feed iCal de Gematsu
        run: |
          mkdir -p public
          curl -fsSL \
            --retry 4 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            -A "Mozilla/5.0 (compatible; gematsu-calendar-bot/1.0; +https://github.com/backmind/gematsu-calendar)" \
            "https://www.gematsu.com/events/?ical=1" \
            -o public/gematsu.ics

      - name: Validar el archivo descargado
        run: |
          # Asegura que sea un iCal real y no una página de error HTML.
          if ! grep -q "BEGIN:VCALENDAR" public/gematsu.ics; then
            echo "::error::El archivo descargado no es un iCal válido."
            echo "----- primeras líneas -----"
            head -c 500 public/gematsu.ics
            exit 1
          fi
          echo "iCal válido. Eventos: $(grep -c 'BEGIN:VEVENT' public/gematsu.ics)"

      - name: Guardar el feed en el repo
        # Commitea el .ics si ha cambiado. Si lleva más de 30 días sin cambiar,
        # hace un commit vacío para que el repo no quede inactivo y GitHub no
        # desactive el cron.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gematsu.ics

          days_since_last_commit=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          events=$(grep -c 'BEGIN:VEVENT' public/gematsu.ics)

          if ! git diff --cached --quiet; then
            git commit -m "Update gematsu.ics: $events events ($(date -u +%Y-%m-%d))"
            git push origin "HEAD:$GITHUB_REF_NAME"
          elif [ "$days_since_last_commit" -ge 30 ]; then
            git commit --allow-empty -m "Keepalive: feed unchanged for $days_since_last_commit days"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Sin cambios en el feed (último commit hace $days_since_last_commit días); nada que commitear."
          fi

      - name: Generar página de inicio
        run: cp index.html public/index.html

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
